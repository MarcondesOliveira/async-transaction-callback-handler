name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  validate:
    name: Build, test and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test deployment orchestration without external requests
        run: python3 -m unittest discover -s tests/delivery -v

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MarcondesOliveira.AsyncTransactions.CallbackHandler.slnx --disable-parallel

      - name: Check formatting
        run: dotnet format MarcondesOliveira.AsyncTransactions.CallbackHandler.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build with analyzers and warnings as errors
        run: dotnet build MarcondesOliveira.AsyncTransactions.CallbackHandler.slnx --no-restore --configuration Release --disable-build-servers -m:1

      - name: Run unit, integration and contract tests
        run: dotnet test MarcondesOliveira.AsyncTransactions.CallbackHandler.slnx --no-build --no-restore --configuration Release --disable-build-servers -m:1

      - name: Audit direct and transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/nuget-audit.json"
          dotnet list MarcondesOliveira.AsyncTransactions.CallbackHandler.slnx package --vulnerable --include-transitive --no-restore --format json --output-version 1 > "$report"
          cat "$report"
          jq -e '
            (.projects | length > 0) and
            ((.problems // []) | length == 0) and
            ([.projects[]?.frameworks[]? |
              (.topLevelPackages[]?, .transitivePackages[]?) |
              select((.vulnerabilities // [] | length) > 0)] | length == 0)
          ' "$report"

  package:
    name: Package Lambda ARM64
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish, package and checksum
        run: bash .github/scripts/package.sh "$RUNNER_TEMP/callback-handler-artifact"

      - name: Store versioned deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: async-transaction-callback-handler-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/callback-handler-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
